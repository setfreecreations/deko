<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <title>Deko v9</title>
  <link rel="stylesheet" href="style.css?v=9">
  <script type="module" src="script.js?v=9"></script>
</head>
<body data-state="neutral">
  <main id="face" aria-label="Deko">
    <div id="clockBlock"><div id="clock">--:--</div><div id="date">---</div></div>
    <video id="cameraVideo" playsinline muted></video>
    <div id="faceCenterMarker" hidden></div>
    <div id="cameraStatus">Kamera av</div>
    <div class="eye-zone left"><div class="eye"></div></div>
    <div class="eye-zone right"><div class="eye"></div></div>
  </main>

  <button id="gearButton" aria-label="Öppna inställningar" title="Inställningar">⚙︎</button>

  <aside id="devPanel" hidden>
    <div class="panelHeader"><strong>Deko v9</strong><button id="closePanel" aria-label="Stäng">×</button></div>
    <div class="tabs"><button class="tab active" data-tab="behavior">Beteende</button><button class="tab" data-tab="appearance">Utseende</button><button class="tab" data-tab="states">Lägen</button></div>

    <section class="tabPage active" data-page="behavior">
      <button id="cameraButton">Starta kamera</button>
      <button id="calibrationButton">Kalibreringsläge</button>
      <label>Horisontell rörelse <output id="outX"></output><input id="rangeX" type="range" min="10" max="70"></label>
      <label>Vertikal rörelse <output id="outY"></output><input id="rangeY" type="range" min="10" max="60"></label>
      <label>Följsamhet <output id="outSmooth"></output><input id="rangeSmooth" type="range" min="10" max="80"></label>
      <label>Återgång <output id="outReturn"></output><input id="rangeReturn" type="range" min="50" max="95"></label>
      <label>Dödzon <output id="outDead"></output><input id="rangeDead" type="range" min="0" max="30"></label>
      <label>Väntan efter förlorat ansikte <output id="outLost"></output><input id="rangeLost" type="range" min="0" max="5" step="0.5"></label>
      <label><input id="idleToggle" type="checkbox"> Små tomgångsrörelser</label>
      <label><input id="markerToggle" type="checkbox"> Visa ansiktscentrum</label>
    </section>

    <section class="tabPage" data-page="appearance">
      <label>Ögonstorlek <output id="outSize"></output><input id="rangeSize" type="range" min="30" max="70"></label>
      <label>Ringtjocklek <output id="outThickness"></output><input id="rangeThickness" type="range" min="2" max="20"></label>
      <label>Ögonplacering <output id="outPosition"></output><input id="rangePosition" type="range" min="25" max="35"></label>
      <label>Vertikal placering <output id="outVertical"></output><input id="rangeVertical" type="range" min="35" max="65"></label>
      <label>Glöd <output id="outGlow"></output><input id="rangeGlow" type="range" min="0" max="100"></label>
      <label class="colorRow">Kulör <input id="eyeColor" type="color"></label>
      <label><input id="blinkToggle" type="checkbox"> Automatisk blinkning</label>
      <label>Blinkintervall <output id="outBlink"></output><input id="rangeBlink" type="range" min="2" max="10"></label>
      <label><input id="doubleBlinkToggle" type="checkbox"> Ibland dubbelblinkning</label>
    </section>

    <section class="tabPage stateGrid" data-page="states">
      <button data-state="neutral">Neutral</button><button data-state="listening">Lyssnar</button><button data-state="thinking">Tänker</button><button data-state="searching">Söker</button><button data-state="happy">Glad</button><button data-state="uncertain">Skeptisk</button><button data-state="surprised">Förvånad</button><button data-state="sleep">Sömn</button>
    </section>

    <div class="panelActions"><button id="saveSettings">Spara</button><button id="copySettings">Kopiera inställningar</button><button id="resetSettings">Återställ standard</button></div>
  </aside>
</body>
</html>
